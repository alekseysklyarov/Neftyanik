name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  build_test:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify production branch
        run: |
          set -Eeuo pipefail
          if [[ "${GITHUB_REF_NAME}" != "master" ]]; then
            echo "Production deployment is only supported from the master branch." >&2
            exit 1
          fi

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution and test projects
        run: |
          set -Eeuo pipefail
          dotnet restore Neftyanik.csproj
          dotnet restore tests/Neftyanik.Portal.Web.Tests/Neftyanik.Portal.Web.Tests.csproj
          dotnet restore tests/Neftyanik.Portal.Infrastructure.Tests/Neftyanik.Portal.Infrastructure.Tests.csproj

      - name: Build Release
        run: |
          set -Eeuo pipefail
          dotnet build Neftyanik.csproj -c Release --no-restore
          dotnet build tests/Neftyanik.Portal.Web.Tests/Neftyanik.Portal.Web.Tests.csproj -c Release --no-restore
          dotnet build tests/Neftyanik.Portal.Infrastructure.Tests/Neftyanik.Portal.Infrastructure.Tests.csproj -c Release --no-restore

      - name: Run web tests
        run: |
          set -Eeuo pipefail
          dotnet test tests/Neftyanik.Portal.Web.Tests/Neftyanik.Portal.Web.Tests.csproj -c Release --no-build --logger "trx;LogFileName=web-tests.trx"

      - name: Run infrastructure tests
        run: |
          set -Eeuo pipefail
          dotnet test tests/Neftyanik.Portal.Infrastructure.Tests/Neftyanik.Portal.Infrastructure.Tests.csproj -c Release --no-build --logger "trx;LogFileName=infrastructure-tests.trx"

  deploy_production:
    runs-on: ubuntu-latest
    needs: build_test
    environment: production

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Prepare SSH
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload deployment scripts
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -Eeuo pipefail
          remote_dir="/tmp/neftyanik-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh_opts=(
            -i ~/.ssh/id_ed25519
            -p "$PROD_SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile=$HOME/.ssh/known_hosts
          )
          scp_opts=(
            -i ~/.ssh/id_ed25519
            -P "$PROD_SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile=$HOME/.ssh/known_hosts
          )
          ssh "${ssh_opts[@]}" "$PROD_SSH_USER@$PROD_SSH_HOST" "install -m 700 -d '$remote_dir'"
          scp "${scp_opts[@]}" deploy/scripts/deploy-production.sh deploy/scripts/create-sql-backup.sh "$PROD_SSH_USER@$PROD_SSH_HOST:$remote_dir/"
          ssh "${ssh_opts[@]}" "$PROD_SSH_USER@$PROD_SSH_HOST" "chmod 700 '$remote_dir/deploy-production.sh' '$remote_dir/create-sql-backup.sh'"

      - name: Deploy tested commit to production
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -Eeuo pipefail
          remote_dir="/tmp/neftyanik-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh_opts=(
            -i ~/.ssh/id_ed25519
            -p "$PROD_SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile=$HOME/.ssh/known_hosts
          )
          ssh "${ssh_opts[@]}" "$PROD_SSH_USER@$PROD_SSH_HOST" "DEPLOY_DIR='/opt/Neftyanik' PRODUCTION_BRANCH='master' BACKUP_SCRIPT_PATH='$remote_dir/create-sql-backup.sh' '$remote_dir/deploy-production.sh' '${GITHUB_SHA}'"

      - name: Deployment summary
        run: |
          set -Eeuo pipefail
          echo "Production deployment completed successfully."
          echo "Deployed commit: ${GITHUB_SHA}"
          echo "Branch: ${GITHUB_REF_NAME}"

      - name: Cleanup remote deployment scripts
        if: always()
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -Eeuo pipefail
          remote_dir="/tmp/neftyanik-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh_opts=(
            -i ~/.ssh/id_ed25519
            -p "$PROD_SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile=$HOME/.ssh/known_hosts
          )
          ssh "${ssh_opts[@]}" "$PROD_SSH_USER@$PROD_SSH_HOST" "rm -rf '$remote_dir'" || true
