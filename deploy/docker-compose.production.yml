name: neftyanik-production

x-web-common: &web-common
  build:
    context: ..
    dockerfile: src/Neftyanik.Portal.Web/Dockerfile
  image: neftyanik-portal-web:production
  environment:
    ASPNETCORE_ENVIRONMENT: Production
    ASPNETCORE_HTTP_PORTS: 8080
    Security__RequireHttps: ${REQUIRE_HTTPS:-true}
    ConnectionStrings__DefaultConnection: Server=sqlserver;Database=${DB_NAME};User ID=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=true
    DataProtection__KeysDirectory: /var/aspnet-data-protection/keys
    ReverseProxy__KnownProxies__0: 172.30.0.3
  networks:
    - neftyanik_private
  depends_on:
    sqlserver:
      condition: service_healthy

services:
  web:
    <<: *web-common
    restart: unless-stopped
    volumes:
      - aspnet_data_protection_keys:/var/aspnet-data-protection/keys
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  migrate:
    <<: *web-common
    profiles: ["migration"]
    restart: "no"
    command: ["migrate-database"]
    volumes:
      - aspnet_data_protection_keys:/var/aspnet-data-protection/keys

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - "127.0.0.1:1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then SQLCMD=/opt/mssql-tools18/bin/sqlcmd; else SQLCMD=/opt/mssql-tools/bin/sqlcmd; fi; $$SQLCMD -S 127.0.0.1 -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b >/dev/null || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      neftyanik_private:
        ipv4_address: 172.30.0.4

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      neftyanik_private:
        ipv4_address: 172.30.0.3

volumes:
  sqlserver_data:
    name: neftyanik_sqlserver_data
  caddy_data:
    name: neftyanik_caddy_data
  caddy_config:
    name: neftyanik_caddy_config
  aspnet_data_protection_keys:
    name: neftyanik_aspnet_data_protection_keys

networks:
  neftyanik_private:
    name: neftyanik_private_network
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
